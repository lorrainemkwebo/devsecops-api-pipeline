name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: OWASP Dependency-Check
        working-directory: api
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: api/target/dependency-check-report.html

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Start API
        working-directory: api
        run: |
          mvn -q package -DskipTests
          nohup java -jar target/*.jar > ../api.log 2>&1 &
          sleep 20
      - name: Run REST Assured security tests
        working-directory: security-tests
        run: mvn -q test

  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Start API
        working-directory: api
        run: |
          mvn -q package -DskipTests
          nohup java -jar target/*.jar > ../api.log 2>&1 &
          sleep 20
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: http://localhost:8080/v3/api-docs
          format: openapi
          fail_action: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html